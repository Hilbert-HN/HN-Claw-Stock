<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN-Claw-Stock - AI Stock Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            display: none;
            margin-top: 20px;
        }
        
        .result.show {
            display: block;
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
        }
        
        .stock-symbol {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .stock-name {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .stock-price {
            text-align: right;
        }
        
        .price {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .change {
            font-size: 16px;
            margin-top: 5px;
        }
        
        .change.positive {
            color: #10b981;
        }
        
        .change.negative {
            color: #ef4444;
        }
        
        .analysis-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .analysis-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .recommendation {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .recommendation.BUY {
            background: #d1fae5;
            color: #059669;
        }
        
        .recommendation.SELL {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .recommendation.HOLD {
            background: #fef3c7;
            color: #d97706;
        }
        
        .confidence {
            margin-bottom: 15px;
        }
        
        .confidence-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s;
        }
        
        .reasoning {
            color: #555;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 12px;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦞 HN-Claw-Stock</h1>
        <p class="subtitle">AI-Powered US Stock Analysis & Trading Suggestions</p>
        
        <div class="search-box">
            <input 
                type="text" 
                id="symbolInput" 
                placeholder="Enter stock symbol (e.g., AAPL, TSLA, NVDA)"
                onkeypress="if(event.key === 'Enter') analyzeStock()"
            >
            <button onclick="analyzeStock()" id="analyzeBtn">Analyze</button>
        </div>
        
        <div class="loading" id="loading">
            <p>🤖 AI is analyzing the stock...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="stock-header">
                <div>
                    <div class="stock-symbol" id="stockSymbol"></div>
                    <div class="stock-name" id="stockName"></div>
                </div>
                <div class="stock-price">
                    <div class="price" id="stockPrice"></div>
                    <div class="change" id="stockChange"></div>
                </div>
            </div>
            
            <div class="analysis-card">
                <div class="analysis-title">🤖 AI Analysis</div>
                <div class="recommendation" id="recommendation"></div>
                
                <div class="confidence">
                    <div>Confidence: <span id="confidenceText"></span>%</div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceBar"></div>
                    </div>
                </div>
                
                <div class="reasoning" id="reasoning"></div>
            </div>
        </div>
        
        <div class="footer">
            <p>Powered by <a href="https://github.com/Hilbert-HN/HN-Claw-Stock" target="_blank">HN-Claw-Stock</a> 🦞</p>
            <p>Co-authored by Claw AI</p>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:8000' 
            : 'http://43.106.71.50:8000';
        
        async function analyzeStock() {
            const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
            
            if (!symbol) {
                showError('Please enter a stock symbol');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('analyzeBtn').disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/stocks/${symbol}`);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to fetch stock data');
                }
                
                const data = await response.json();
                displayResult(data);
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }
        
        function displayResult(data) {
            const { stock, analysis } = data;
            
            // Stock info
            document.getElementById('stockSymbol').textContent = stock.symbol;
            document.getElementById('stockName').textContent = stock.name;
            document.getElementById('stockPrice').textContent = `$${stock.price?.toFixed(2) || 'N/A'}`;
            
            const change = stock.change;
            const changePercent = stock.changePercent;
            const changeEl = document.getElementById('stockChange');
            
            if (change !== null && changePercent !== null) {
                const sign = change >= 0 ? '+' : '';
                changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                changeEl.className = 'change ' + (change >= 0 ? 'positive' : 'negative');
            } else {
                changeEl.textContent = 'N/A';
                changeEl.className = 'change';
            }
            
            // Analysis
            const recEl = document.getElementById('recommendation');
            recEl.textContent = analysis.recommendation;
            recEl.className = 'recommendation ' + analysis.recommendation;
            
            document.getElementById('confidenceText').textContent = analysis.confidence;
            document.getElementById('confidenceBar').style.width = analysis.confidence + '%';
            
            document.getElementById('reasoning').textContent = analysis.reasoning;
            
            // Show result
            document.getElementById('result').classList.add('show');
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
        }
    </script>
</body>
</html>
